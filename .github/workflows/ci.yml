name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check
        run: node --check src/server.js && node --check src/manifest.js
      - name: Assert no secrets committed
        run: |
          if git ls-files | grep -E '\.(key|pem|p12|pfx)$'; then
            echo "::error::certificate or key material is tracked by git"
            exit 1
          fi
          echo "no key material tracked"
